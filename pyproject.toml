[project]
name = "TrainTicketPriceCalculator"
version = "0.1.0"
description = ""
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "coverage>=7.11.0",
    "ruff>=0.14.2",
    "pytest-cov>=7.0.0",
    "pytest-json-report>=1.5.0",
    "requests>=2.32.5",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 90
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
